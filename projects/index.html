<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Chu-Jie Qin | Paper Galaxy</title>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.164.0/build/three.module.js"
    }
  }
  </script>
  <style>
    html, body, #root {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 38%, rgba(35,48,86,0.62), transparent 30%),
        radial-gradient(circle at 20% 15%, rgba(255,183,98,0.12), transparent 24%),
        #070813;
    }
    /* 悬浮信息面板 */
    #highlight {
      position: fixed;
      top: 68px;
      left: 20px;
      padding: 8px;
      background: rgba(4,8,20,0.72);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      font-family: sans-serif;
      pointer-events: none;
      display: none;
      max-width: 800px;
      line-height: 1.4;
      font-size: 14px;
    }
    #topbar {
      position: fixed;
      top: 18px;
      left: 20px;
      right: 20px;
      z-index: 12;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      pointer-events: none;
      font-family: sans-serif;
    }
    #homeLink,
    #paperCount {
      pointer-events: auto;
      padding: 8px 10px;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 8px;
      background: rgba(4,8,20,0.68);
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      backdrop-filter: blur(14px);
    }
    #paperCount {
      color: #ffca7a;
    }
    /* 屏幕下方研究领域标签 */
    #regionTag {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 6px 12px;
      background: rgba(4,8,20,0.68);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 8px;
      font-family: sans-serif;
      pointer-events: none;
      font-size: 20px;
    }
    /* 中心十字 */
    #crosshair {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 20px;
      height: 20px;
      pointer-events: none;
      transform: translate(-50%, -50%);
    }
    #crosshair:before, #crosshair:after {
      content: "";
      position: absolute;
      background: rgba(255,255,255,0.7);
    }
    #crosshair:before {
      left: 50%;
      top: 0;
      width: 1px;
      height: 100%;
      transform: translateX(-50%);
    }
    #crosshair:after {
      top: 50%;
      left: 0;
      height: 1px;
      width: 100%;
      transform: translateY(-50%);
    }
    /* 右侧 Readme 面板 */
    #readme {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 400px;
      padding: 12px;
      background: rgba(4,8,20,0.72);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      font-family: sans-serif;
      line-height: 1.4;
      z-index: 10;
      backdrop-filter: blur(16px);
    }
    #readme-close {
      position: absolute;
      top: 8px;
      right: 10px;
      cursor: pointer;
      font-size: 25px;
      color: #fff;
    }
    #readme-content {
      margin-top: 4px;
      font-size: 16px;
    }
    @media (max-width: 760px) {
      #topbar {
        flex-direction: column;
      }
      #highlight {
        top: 110px;
        right: 20px;
        max-width: calc(100vw - 40px);
      }
      #readme {
        top: auto;
        right: 20px;
        bottom: 70px;
        left: 20px;
        width: auto;
      }
      #regionTag {
        width: calc(100vw - 40px);
        text-align: center;
        font-size: 15px;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="topbar">
    <a id="homeLink" href="/">Back to homepage</a>
    <div id="paperCount">Loading papers...</div>
  </div>
  <div id="highlight"></div>
  <div id="regionTag"></div>
  <div id="crosshair"></div>
  <div id="readme">
    <div id="readme-close">×</div>
    <div id="readme-content">
      This galaxy maps Chu-Jie Qin's publications into semantic research regions.<br>
      <b>Hover an orange star for details. Click a star to open the project page.</b><br>
      Drag to orbit, scroll to zoom, and use the crosshair to aim.
    </div>
  </div>

  <script type="module">
    import * as THREE          from 'three';
    import { OrbitControls }   from 'https://unpkg.com/three@0.164.0/examples/jsm/controls/OrbitControls.js';
    import { EffectComposer }  from 'https://unpkg.com/three@0.164.0/examples/jsm/postprocessing/EffectComposer.js';
    import { RenderPass }      from 'https://unpkg.com/three@0.164.0/examples/jsm/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'https://unpkg.com/three@0.164.0/examples/jsm/postprocessing/UnrealBloomPass.js';

    // —— 场景 & 相机 & 渲染器 —— //
    const scene    = new THREE.Scene();
    scene.background = new THREE.Color(0x070813);
    scene.fog        = new THREE.FogExp2(0x070813, 0.0022);

    const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 500);
    camera.position.set(0, 0, 50);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(innerWidth, innerHeight);
    document.getElementById('root').appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor  = 0.05;

    // —— 星空背景 —— //
    (function addStarField(count = 3000) {
      const geo = new THREE.BufferGeometry();
      const pos = new Float32Array(count * 3);
      for (let i = 0; i < count; i++) {
        pos[3*i]   = (Math.random() - 0.5) * 400;
        pos[3*i+1] = (Math.random() - 0.5) * 400;
        pos[3*i+2] = (Math.random() - 0.5) * 400;
      }
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      const mat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.7, transparent: true, opacity: 0.8 });
      scene.add(new THREE.Points(geo, mat));
    })();

    // —— 光源 —— //
    scene.add(new THREE.HemisphereLight(0x536f9f, 0x151422, 0.58));
    const dir = new THREE.DirectionalLight(0xffe6b0, 0.9);
    dir.position.set(10, 20, 10);
    scene.add(dir);
    const rim = new THREE.PointLight(0x87c7ff, 1.2, 120);
    rim.position.set(-24, 18, 28);
    scene.add(rim);

    // —— 后期 Bloom —— //
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    composer.addPass(new UnrealBloomPass(
      new THREE.Vector2(innerWidth, innerHeight),
      1.45, 0.46, 0.72
    ));

    // —— 悬浮高亮环 —— //
    const ringGeo = new THREE.RingGeometry(1.08, 1.16, 48);
    const ringMat = new THREE.MeshBasicMaterial({
      color: 0xffffff, side: THREE.DoubleSide, transparent: true, opacity: 0.8
    });
    const highlightRing = new THREE.Mesh(ringGeo, ringMat);
    highlightRing.visible = false;
    scene.add(highlightRing);

    const galaxyPalette = [0xffb45f, 0x77d6ff, 0xcaa7ff, 0x8df2d0, 0xff7f93];
    const githubCache = new Map();
    const PLANET_INFLUENCE_GAIN = 0.6;
    const ORBIT_TOPOLOGY = [
      {
        parent: 'qin2023ram',
        child: 'qin2025ramplus',
        speed: 0.00038,
        tilt: 0.32,
        color: 0x77d6ff
      }
    ];
    const orbitRelations = [];
    const orbitChildrenByParent = new Map();

    function makeGlowTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');
      const gradient = ctx.createRadialGradient(64, 64, 4, 64, 64, 62);
      gradient.addColorStop(0, 'rgba(255,255,255,0.95)');
      gradient.addColorStop(0.28, 'rgba(255,190,104,0.44)');
      gradient.addColorStop(1, 'rgba(255,190,104,0)');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 128, 128);
      return new THREE.CanvasTexture(canvas);
    }

    function makeStarTexture(baseColor, accentColor, seed) {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');
      const base = `#${baseColor.getHexString()}`;
      const accent = `#${accentColor.getHexString()}`;

      const vertical = ctx.createLinearGradient(0, 0, 0, canvas.height);
      vertical.addColorStop(0, '#ffffff');
      vertical.addColorStop(0.16, accent);
      vertical.addColorStop(0.52, base);
      vertical.addColorStop(0.82, '#251a30');
      vertical.addColorStop(1, '#050710');
      ctx.fillStyle = vertical;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < 9; i++) {
        const y = ((i * 31 + seed * 47) % canvas.height) - 34;
        const band = ctx.createLinearGradient(0, y, canvas.width, y + 54);
        band.addColorStop(0, 'rgba(255,255,255,0)');
        band.addColorStop(0.5, i % 2 ? 'rgba(255,255,255,0.18)' : 'rgba(0,0,0,0.16)');
        band.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = band;
        ctx.save();
        ctx.translate(canvas.width / 2, canvas.height / 2);
        ctx.rotate((i % 2 ? -1 : 1) * 0.18);
        ctx.fillRect(-canvas.width, y - canvas.height / 2, canvas.width * 2, 18 + (i % 3) * 7);
        ctx.restore();
      }

      for (let i = 0; i < 420; i++) {
        const x = (Math.sin(i * 19.19 + seed) * 0.5 + 0.5) * canvas.width;
        const y = (Math.cos(i * 13.73 + seed) * 0.5 + 0.5) * canvas.height;
        const alpha = 0.08 + ((i + seed) % 7) * 0.014;
        ctx.fillStyle = `rgba(255,255,255,${alpha})`;
        ctx.fillRect(x, y, 1.2, 1.2);
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.ClampToEdgeWrapping;
      texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
      return texture;
    }

    function baseStarRadius(stats = {}) {
      const stars = stats.stars || 0;
      return THREE.MathUtils.clamp(0.34 + Math.log10(stars + 1) * 0.22, 0.34, 1.05);
    }

    async function fetchGithubStats(repo) {
      if (!repo) return null;
      if (githubCache.has(repo)) return githubCache.get(repo);
      const statsPromise = fetch(`https://api.github.com/repos/${repo}`, {
        headers: { Accept: 'application/vnd.github+json' }
      })
        .then(response => {
          if (!response.ok) throw new Error(`GitHub API returned ${response.status}`);
          return response.json();
        })
        .then(data => ({
          stars: data.stargazers_count,
          forks: data.forks_count
        }))
        .catch(() => null);
      githubCache.set(repo, statsPromise);
      return statsPromise;
    }

    function updateStarVisualSize(mesh) {
      const radius = mesh.userData.starRadius || mesh.userData.baseRadius || 0.34;
      mesh.scale.setScalar(radius);
      if (mesh.userData.glow) {
        mesh.userData.glow.scale.setScalar(radius * 5.4);
      }
      if (mesh.userData.light) {
        mesh.userData.light.intensity = 0.45 + radius * 0.75;
      }
    }

    function recomputeInfluenceRadii() {
      const resolving = new Set();
      const resolved = new Map();

      function resolve(mesh) {
        if (!mesh) return 0;
        if (resolved.has(mesh.userData.id)) return resolved.get(mesh.userData.id);
        if (resolving.has(mesh.userData.id)) {
          console.warn(`Orbit topology cycle ignored at ${mesh.userData.id}`);
          return mesh.userData.baseRadius || 0.34;
        }

        resolving.add(mesh.userData.id);
        const childBoost = orbitRelations
          .filter(relation => relation.parent === mesh)
          .reduce((sum, relation) => sum + resolve(relation.child) * PLANET_INFLUENCE_GAIN, 0);
        resolving.delete(mesh.userData.id);

        const baseRadius = mesh.userData.baseRadius || 0.34;
        const effectiveRadius = THREE.MathUtils.clamp(baseRadius + childBoost, baseRadius, 1.55);
        mesh.userData.starRadius = effectiveRadius;
        resolved.set(mesh.userData.id, effectiveRadius);
        return effectiveRadius;
      }

      spheres.forEach(resolve);
      spheres.forEach(updateStarVisualSize);
    }

    function applyStarStats(mesh, stats) {
      mesh.userData.baseRadius = baseStarRadius(stats);
      recomputeInfluenceRadii();
    }

    function orbitPosition(center, relation, angle) {
      return new THREE.Vector3(
        center.x + Math.cos(angle) * relation.radius,
        center.y + Math.sin(angle) * Math.sin(relation.tilt) * relation.radius,
        center.z + Math.sin(angle) * Math.cos(relation.tilt) * relation.radius
      );
    }

    function makeOrbitPath(relation) {
      const points = [];
      const origin = new THREE.Vector3(0, 0, 0);
      for (let i = 0; i <= 192; i++) {
        points.push(orbitPosition(origin, relation, (i / 192) * Math.PI * 2));
      }
      const orbitGeo = new THREE.BufferGeometry().setFromPoints(points);
      const orbitMat = new THREE.LineBasicMaterial({
        color: relation.color,
        transparent: true,
        opacity: 0.34,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      });
      return new THREE.LineLoop(orbitGeo, orbitMat);
    }

    function configureOrbitTopology() {
      orbitRelations.length = 0;
      orbitChildrenByParent.clear();

      ORBIT_TOPOLOGY.forEach(config => {
        const parent = sphereById.get(config.parent);
        const child = sphereById.get(config.child);
        if (!parent || !child) return;

        const radius = config.radius ?? parent.position.distanceTo(child.position);
        const initialAngle = Math.atan2(
          child.position.z - parent.position.z,
          child.position.x - parent.position.x
        );
        const relation = {
          ...config,
          parent,
          child,
          radius,
          initialAngle,
          tilt: config.tilt || 0,
          speed: config.speed || 0.00032,
          color: config.color || 0x77d6ff
        };
        relation.path = makeOrbitPath(relation);
        relation.path.position.copy(parent.position);
        scene.add(relation.path);
        child.userData.orbitRelation = relation;
        orbitRelations.push(relation);
        if (!orbitChildrenByParent.has(parent)) {
          orbitChildrenByParent.set(parent, []);
        }
        orbitChildrenByParent.get(parent).push(relation);
      });

      recomputeInfluenceRadii();
    }

    function updateOrbitPositions(elapsed) {
      const visited = new Set();

      function updateChildren(parent) {
        if (visited.has(parent.userData.id)) return;
        visited.add(parent.userData.id);
        (orbitChildrenByParent.get(parent) || []).forEach(relation => {
          const angle = relation.initialAngle + elapsed * relation.speed;
          relation.child.position.copy(orbitPosition(relation.parent.position, relation, angle));
          if (relation.path) {
            relation.path.position.copy(relation.parent.position);
          }
          updateChildren(relation.child);
        });
      }

      spheres
        .filter(mesh => !mesh.userData.orbitRelation)
        .forEach(updateChildren);
    }

    // —— 加载数据 & 添加星体 —— //
    const spheres = [];
    const sphereById = new Map();
    const glowTexture = makeGlowTexture();
    fetch('galaxy.json')
      .then(r => r.json())
      .then(data => {
        const geo = new THREE.SphereGeometry(1, 32, 32);

        data.forEach((p, index) => {
          const color = new THREE.Color(galaxyPalette[index % galaxyPalette.length]);
          const accent = color.clone().lerp(new THREE.Color(0xffffff), 0.42);
          const starTexture = makeStarTexture(color, accent, index + 1);
          const mat = new THREE.MeshPhysicalMaterial({
            color,
            map: starTexture,
            emissiveMap: starTexture,
            emissive: color,
            emissiveIntensity: 0.52,
            roughness: 0.28,
            metalness: 0.08,
            clearcoat: 0.45,
            clearcoatRoughness: 0.22
          });
          const mesh = new THREE.Mesh(geo, mat);
          mesh.position.set(...p.pos);
          mesh.userData = {
            ...p,
            basePosition: new THREE.Vector3(...p.pos),
            spinSpeed: 0.0022 + index * 0.0007,
            orbitPhase: Math.random() * Math.PI * 2
          };

          const glow = new THREE.Sprite(new THREE.SpriteMaterial({
            map: glowTexture,
            color,
            transparent: true,
            opacity: 0.64,
            depthWrite: false,
            blending: THREE.AdditiveBlending
          }));
          glow.position.copy(mesh.position);
          mesh.userData.glow = glow;
          scene.add(glow);

          const light = new THREE.PointLight(color, 0.72, 14);
          light.position.copy(mesh.position);
          mesh.userData.light = light;
          scene.add(light);

          mesh.userData.baseRadius = baseStarRadius(p.stats);
          updateStarVisualSize(mesh);
          scene.add(mesh);
          spheres.push(mesh);
          sphereById.set(p.id, mesh);

          fetchGithubStats(p.github).then(stats => {
            if (!stats) return;
            mesh.userData.githubStats = stats;
            applyStarStats(mesh, stats);
          });
        });

        configureOrbitTopology();

        document.getElementById('paperCount').textContent = `${data.length} papers in galaxy`;

        // 自动对齐相机 & 控制中心
        const center = new THREE.Vector3();
        data.forEach(p => center.add(new THREE.Vector3(...p.pos)));
        center.divideScalar(data.length);
        camera.position.copy(center.clone().add(new THREE.Vector3(0, 0, 6)));
        controls.target.copy(center);
        controls.update();
      })
      .catch(err => {
        document.getElementById('paperCount').textContent = 'Unable to load papers';
        console.error(err);
      });

    // —— 交互 & 事件 —— //
    const raycaster = new THREE.Raycaster();
    const pointer   = new THREE.Vector2();
    const hl        = document.getElementById('highlight');
    const regionTag = document.getElementById('regionTag');
    const readme    = document.getElementById('readme');
    const closeBtn  = document.getElementById('readme-close');

    // 关闭 Readme
    closeBtn.addEventListener('click', () => {
      readme.style.display = 'none';
    });

    // 更新 pointer
    renderer.domElement.addEventListener('pointermove', e => {
      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x =  ((e.clientX - rect.left) / rect.width)  * 2 - 1;
      pointer.y = -((e.clientY - rect.top)  / rect.height) * 2 + 1;
    });

    // 点击跳转 homepage
    renderer.domElement.addEventListener('click', () => {
      raycaster.setFromCamera(pointer, camera);
      const hit = raycaster.intersectObjects(spheres)[0];
      if (hit && hit.object.userData.homepage) {
        window.open(hit.object.userData.homepage, '_blank');
      }
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();

      if (spheres.length) {
        const elapsed = performance.now();
        updateOrbitPositions(elapsed);

        spheres.forEach(mesh => {
          mesh.rotation.y += mesh.userData.spinSpeed;
          mesh.rotation.x += mesh.userData.spinSpeed * 0.36;
          const pulse = 1 + Math.sin(elapsed * 0.0018 + mesh.userData.orbitPhase) * 0.035;
          mesh.scale.setScalar((mesh.userData.starRadius || 0.34) * pulse);
          if (mesh.userData.glow) {
            mesh.userData.glow.position.copy(mesh.position);
            mesh.userData.glow.material.opacity = 0.48 + pulse * 0.1;
          }
          if (mesh.userData.light) {
            mesh.userData.light.position.copy(mesh.position);
          }
        });

        // 悬浮高亮 & 信息面板
        raycaster.setFromCamera(pointer, camera);
        const hit = raycaster.intersectObjects(spheres)[0];
        if (hit) {
          const d = hit.object.userData;
          const githubLine = d.githubStats
            ? `<br><span style="color:#ffca7a;">★ ${d.githubStats.stars} stars · ${d.githubStats.forks} forks</span>`
            : d.github
              ? `<br><span style="color:#ffca7a;">GitHub: ${d.github}</span>`
              : '';
          hl.style.display = 'block';
          hl.innerHTML = `
            <b>${d.title}</b><br>
            <i>${d.published}</i><br>
            ${d.authors.join(', ')}<br>
            ${githubLine}
            <a href="${d.url}" target="_blank" style="color:#88caff;">Click star to open the project page</a>
          `;
          highlightRing.visible = true;
          highlightRing.position.copy(hit.object.position);
          highlightRing.scale.setScalar((hit.object.userData.starRadius || 0.34) * 1.18);
          highlightRing.lookAt(camera.position);
        } else {
          hl.style.display = 'none';
          highlightRing.visible = false;
        }

        // 计算离相机最近的球体并更新研究领域标签
        let nearest = null, minD = Infinity;
        spheres.forEach(m => {
          const d = camera.position.distanceTo(m.position);
          if (d < minD) { minD = d; nearest = m; }
        });
        const tag = nearest?.userData.tags?.[0] || '';
        regionTag.textContent = tag
          ? `Research Region: ${tag}`
          : '';
      }

      composer.render();
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      composer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
